<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>日枝花朵渲染压力样本</title>
<style>body{margin:0;background:#22343a;color:#edf3ef;font:14px system-ui}#field{position:relative;width:760px;height:360px;margin:24px;overflow:hidden}#field>svg,#field>canvas{position:absolute;inset:0}.flower{position:absolute;width:18px;height:18px;transform:translate(-50%,-50%)}</style>
<div id="field"></div>
<script>
(function(){
const field=document.getElementById('field'),width=760,height=360;
const petals=Array.from({length:5},(_,i)=>'<ellipse cx="12" cy="7.5" rx="3.1" ry="4.9" transform="rotate('+(i*72)+' 12 12)"/>').join('');
const shape='<g fill="#b9cfc5">'+petals+'</g><circle cx="12" cy="12" r="2.3" fill="#cdb98e"/>';
let cache=null,retained=null,spriteUrl=null;
function flower(ctx,size){
 ctx.save();ctx.translate(size/2,size/2);ctx.scale(size/24,size/24);
 ctx.fillStyle='#b9cfc5';for(let i=0;i<5;i++){ctx.save();ctx.rotate(i*Math.PI*2/5);ctx.beginPath();ctx.ellipse(0,-4.5,3.1,4.9,0,0,Math.PI*2);ctx.fill();ctx.restore()}
 ctx.fillStyle='#cdb98e';ctx.beginPath();ctx.arc(0,0,2.3,0,Math.PI*2);ctx.fill();ctx.restore();
}
function cached(){if(cache)return cache;cache=document.createElement('canvas');cache.width=96;cache.height=96;flower(cache.getContext('2d'),96);return cache}
function positions(n){
 const columns=Math.ceil(Math.sqrt(n*width/height)),rows=Math.ceil(n/columns),cellWidth=width/columns,cellHeight=height/rows;
 return Array.from({length:n},(_,i)=>({x:(i%columns+.5)*cellWidth,y:(Math.floor(i/columns)+.5)*cellHeight}));
}
window.bench={
 clear(){field.replaceChildren();retained=null;},
 render(method,n){
  field.replaceChildren();retained=positions(n);const points=retained,start=performance.now();
  if(method==='svg-expanded'){
   field.innerHTML=points.map(p=>'<svg class="flower" style="left:'+p.x+'px;top:'+p.y+'px" viewBox="0 0 24 24">'+shape+'</svg>').join('');
  }else if(method==='svg-use'){
   field.innerHTML='<svg width="'+width+'" height="'+height+'" viewBox="0 0 '+width+' '+height+'"><defs><symbol id="perf-flower" viewBox="0 0 24 24">'+shape+'</symbol></defs>'+points.map(p=>'<use href="#perf-flower" x="'+(p.x-9)+'" y="'+(p.y-9)+'" width="18" height="18"/>').join('')+'</svg>';
  }else if(method==='img-shared'){
   if(!spriteUrl){const binary=atob(cached().toDataURL().split(',')[1]),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));spriteUrl=URL.createObjectURL(new Blob([bytes],{type:'image/png'}))}
   field.innerHTML=points.map(p=>'<img class="flower" src="'+spriteUrl+'" style="left:'+p.x+'px;top:'+p.y+'px" alt="">').join('');
  }else{
   const canvas=document.createElement('canvas'),dpr=Math.min(devicePixelRatio,2);canvas.width=width*dpr;canvas.height=height*dpr;canvas.style.width=width+'px';canvas.style.height=height+'px';field.append(canvas);
   const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
   if(method==='canvas-sprite'){const image=cached();points.forEach(p=>ctx.drawImage(image,p.x-9,p.y-9,18,18))}
   else points.forEach(p=>{ctx.save();ctx.translate(p.x-9,p.y-9);flower(ctx,18);ctx.restore()});
  }
  field.getBoundingClientRect();
  return {method,count:n,buildMs:performance.now()-start,nodes:field.querySelectorAll('*').length,canvasBackingMiB:method.startsWith('canvas')?Math.round(width*height*Math.min(devicePixelRatio,2)**2*4/1048576*100)/100:0};
 },
 async frames(method,n){
  this.render(method,n);const frames=[];let previous=performance.now(),start=previous;
  await new Promise(resolve=>{const tick=now=>{frames.push(now-previous);previous=now;if(now-start<1100)requestAnimationFrame(tick);else resolve()};requestAnimationFrame(tick)});
  return frames.slice(2);
 },
 async bloom(concurrent){
  this.render('svg-expanded',36);
  const icons=Array.from(field.querySelectorAll('svg')).slice(0,concurrent);
  icons.forEach(icon=>icon.animate([{transform:'translate(-50%,-50%) scale(.25) rotate(-10deg)',opacity:0},{transform:'translate(-50%,-50%) scale(1.05) rotate(0)',opacity:1,offset:.72},{transform:'translate(-50%,-50%) scale(1)',opacity:1}],{duration:420,easing:'cubic-bezier(.16,1,.3,1)'}));
  const frames=[];let previous=performance.now(),start=previous;
  await new Promise(resolve=>{const tick=now=>{frames.push(now-previous);previous=now;if(now-start<650)requestAnimationFrame(tick);else resolve()};requestAnimationFrame(tick)});
  return frames.slice(2);
 }
};
})();
</script></html>
